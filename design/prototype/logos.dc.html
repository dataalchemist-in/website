<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4A12A","options":["#D4A12A","#E0B347","#C98B2B","#BFA36A"]},"$preview":{"width":1440,"height":820}}'>

renderVals() {
