<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.4" fill="#E8EEEA" fill-opacity="0.13"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#D4A12A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D4A12A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.45" stop-color="#13221F" stop-opacity="0"/>
      <stop offset="1" stop-color="#13221F" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#13221F"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <!-- Logo, dark variant, and wordmark -->
  <g transform="translate(80 62) scale(0.62)">
    <circle cx="36" cy="62" r="22" fill="none" stroke="#E8EEEA" stroke-width="10"/>
    <line x1="63" y1="10" x2="63" y2="84" stroke="#E8EEEA" stroke-width="10" stroke-linecap="round"/>
    <circle cx="100" cy="62" r="27" fill="#D4A12A"/>
    <line x1="127" y1="36" x2="127" y2="84" stroke="#E8EEEA" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="182" y="111" font-family="Young Serif" font-size="34" fill="#E8EEEA">Data Alchemist</text>

  <!-- Headline -->
  <text font-family="Young Serif" font-size="96" letter-spacing="-1.9" fill="#E8EEEA">
    <tspan x="76" y="282">Simple apps for</tspan>
    <tspan x="76" y="384" fill="#D4A12A">everyday India.</tspan>
  </text>
  <text x="80" y="452" font-family="Schibsted Grotesk" font-size="30" fill="#B9C6C1">No queues. No paper. No stress.</text>

  <!-- Coming soon pill and address -->
  <rect x="80" y="514" width="468" height="52" rx="26" fill="#13221F" stroke="#D4A12A" stroke-opacity="0.7" stroke-width="1.5"/>
  <circle cx="108" cy="540" r="6" fill="#D4A12A"/>
  <text x="128" y="549" font-family="Schibsted Grotesk" font-size="24" font-weight="500" fill="#E8EEEA">Coming soon: Bookshaw and Kipsa</text>
  <text x="1120" y="549" text-anchor="end" font-family="Schibsted Grotesk" font-size="24" font-weight="500" fill="#B9C6C1">dataalchemist.in</text>
</svg>
